name: iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unique App Store build number (continue after 6)
        required: true
        default: '7'
        type: string
permissions:
  contents: read
concurrency:
  group: arrify-testflight
  cancel-in-progress: false
jobs:
  distribute:
    if: github.ref == 'refs/heads/main'
    environment: testflight
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Qualify API and playback policy
        working-directory: ios
        run: swift test
      - name: Qualify simulator UI
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcodebuild -project ios/Arrify.xcodeproj -scheme Arrify -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO test
      - name: Sign and upload internal TestFlight build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: bash ios/tools/testflight.sh
