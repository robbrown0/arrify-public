name: iOS prototype
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios*.yml']
  push:
    branches: ['main']
    paths: ['ios/**', '.github/workflows/ios*.yml']
  workflow_dispatch:
    inputs:
      ipad_only:
        description: Rerun iPad qualification after a simulator infrastructure failure
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apple-build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test API contracts
        working-directory: ios
        run: swift test
      - name: Build for physical devices without signing
        run: xcodebuild -project ios/Arrify.xcodeproj -scheme Arrify -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Verify archive capability preservation
        run: bash ios/tools/prepare_entitlements.sh build/device/Build/Products/Release-iphoneos/Arrify.app ios/App/Arrify.entitlements
      - name: Simulator UI test
        if: ${{ inputs.ipad_only != true }}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl shutdown all || true
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project ios/Arrify.xcodeproj -scheme Arrify -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator -resultBundlePath build/UITests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: iPad launch and accessibility smoke test
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPad")))')
          xcrun simctl shutdown all || true
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project ios/Arrify.xcodeproj -scheme Arrify -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator -resultBundlePath build/iPadTests.xcresult -only-testing:ArrifyUITests/LaunchTests/testSignInIsAccessibleAndDoesNotAutoplay -only-testing:ArrifyUITests/LaunchTests/testAlbumsChannelsAndMoodNavigation -only-testing:ArrifyUITests/LaunchTests/testLastChannelClearsMiniPlayerAndRepeatControls -only-testing:ArrifyUITests/LaunchTests/testTabletSearchKeepsHeaderAndPlayerVisible -only-testing:ArrifyUITests/LaunchTests/testLongTitlePlayerDismissalRestoresSearchResponsiveness -only-testing:ArrifyUITests/LaunchTests/testCreatePlaylist -only-testing:ArrifyUITests/LaunchTests/testRemotePlaybackOffersTakeoverFromBrowsing CODE_SIGNING_ALLOWED=NO test
      - name: Export test screenshots
        if: always()
        run: |
          if [ -d build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path build/screenshots/iphone
          fi
          if [ -d build/iPadTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/iPadTests.xcresult --output-path build/screenshots/ipad
          fi
      - name: Preserve simulator build and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arrify-prototype-${{ github.sha }}
          path: |
            build/screenshots
            build/UITests.xcresult
            build/iPadTests.xcresult
            build/simulator/Build/Products/Debug-iphonesimulator/Arrify.app
          retention-days: 7
