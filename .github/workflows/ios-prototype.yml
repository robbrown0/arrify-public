name: iOS prototype
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios*.yml']
  push:
    branches: ['main']
    paths: ['ios/**', '.github/workflows/ios*.yml']
  workflow_dispatch:
    inputs:
      ipad_only:
        description: Rerun iPad qualification after a simulator infrastructure failure
        type: boolean
        default: false
      audiobooks_only:
        description: Audiobook download, session, handoff, player, and catalog boundary checks
        type: boolean
        default: false
      read_recovery_only:
        description: Playback app regressions plus Home and saved-song recovery UI checks
        type: boolean
        default: false
      navigation_refresh_only:
        description: Targeted chart refresh, music destination, and catalog paging checks
        type: boolean
        default: false
      volume_alignment_only:
        description: Targeted iPad mini-player volume layout qualification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON((inputs.ipad_only || inputs.volume_alignment_only) && '["iPad"]' || '["iPhone","iPad"]') }}
        suite: ${{ fromJSON((inputs.volume_alignment_only || inputs.navigation_refresh_only || inputs.read_recovery_only || inputs.audiobooks_only) && '["targeted"]' || '["app","ui"]') }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test API contracts
        if: matrix.suite != 'ui'
        working-directory: ios
        run: swift test
      - name: Build for physical devices without signing
        if: matrix.suite != 'ui' && (matrix.device == 'iPhone' || inputs.ipad_only || inputs.volume_alignment_only)
        run: xcodebuild -project ios/Arrify.xcodeproj -scheme Arrify -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
      - name: Verify archive capability preservation
        if: matrix.suite != 'ui' && (matrix.device == 'iPhone' || inputs.ipad_only || inputs.volume_alignment_only)
        run: bash ios/tools/prepare_entitlements.sh build/device/Build/Products/Release-iphoneos/Arrify.app ios/App/Arrify.entitlements
      - name: Qualify playback app regressions
        if: matrix.suite == 'app'
        env:
          DEVICE_FAMILY: ${{ matrix.device }}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,os,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith(os.environ["DEVICE_FAMILY"])))')
          xcodebuild -project ios/Arrify.xcodeproj -scheme Arrify -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator -resultBundlePath "build/${DEVICE_FAMILY}AppTests.xcresult" -only-testing:ArrifyAppTests CODE_SIGNING_ALLOWED=NO -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 test
      - name: Qualify app and UI regressions
        if: matrix.suite != 'app'
        env:
          DEVICE_FAMILY: ${{ matrix.device }}
          VOLUME_ONLY: ${{ inputs.volume_alignment_only }}
          NAVIGATION_ONLY: ${{ inputs.navigation_refresh_only }}
          RECOVERY_ONLY: ${{ inputs.read_recovery_only }}
          AUDIOBOOKS_ONLY: ${{ inputs.audiobooks_only }}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,os,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith(os.environ["DEVICE_FAMILY"])))')
          ONLY_TESTS=(-only-testing:ArrifyUITests)
          if [ "$AUDIOBOOKS_ONLY" = "true" ]; then
            ONLY_TESTS=(-only-testing:ArrifyAppTests/AudiobookDownloadTests -only-testing:ArrifyAppTests/AudiobookSessionTests -only-testing:ArrifyAppTests/PlaybackTransitionTests/testAudiobookHandoffPreservesSystemMetadataAndCachedMusicSuccessors -only-testing:ArrifyAppTests/PlaybackTransitionTests/testReadAheadKeepsVerifiedLocalSuccessors -only-testing:ArrifyUITests/LaunchTests/testAudiobookShelfPlayerAndOptionalSettings -only-testing:ArrifyUITests/LaunchTests/testAudiobookAuthorSeriesNavigationAndBookNumbers -only-testing:ArrifyUITests/LaunchTests/testAudiobookChapterJumpHighlightsPlayingChapterAndCanMarkUnread -only-testing:ArrifyUITests/LaunchTests/testAudiobookDownloadPiePausesAndResumesWithoutPausingPlayback -only-testing:ArrifyAppTests/NowPlayingArtworkTests/testAirPlayMetadataEmbedsArtworkAndReplacesOldCover -only-testing:ArrifyUITests/LaunchTests/testArtistsSelectDistinctItemsAndVisiblePageRetry)
          fi
          if [ "$VOLUME_ONLY" = "true" ]; then
            ONLY_TESTS=(-only-testing:ArrifyAppTests/NowPlayingArtworkTests/testNativeControlRegistrationDoesNotCreateObservationDependencies)
          fi
          if [ "$RECOVERY_ONLY" = "true" ]; then
            ONLY_TESTS=(-only-testing:ArrifyAppTests -only-testing:ArrifyUITests/LaunchTests/testHomePullRefreshRecoversSavedSongsWithoutVisitingLikedSongs -only-testing:ArrifyUITests/LaunchTests/testHomeRecoversBriefFailureAndPlayerCanRetrySavedSongs -only-testing:ArrifyUITests/LaunchTests/testAudiobookShelfRecoversAndKeepsKnownBooksDuringOutage)
          fi
          if [ "$NAVIGATION_ONLY" = "true" ]; then
            ONLY_TESTS=(-only-testing:ArrifyUITests/LaunchTests/testBrowseCategoriesChartsAndRequests -only-testing:ArrifyUITests/LaunchTests/testEmptyPlayerAndSingleTapAlbumActions -only-testing:ArrifyUITests/LaunchTests/testArtistsSelectDistinctItemsAndVisiblePageRetry)
          fi
          xcodebuild -project ios/Arrify.xcodeproj -scheme Arrify -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator -resultBundlePath "build/${DEVICE_FAMILY}Tests.xcresult" "${ONLY_TESTS[@]}" CODE_SIGNING_ALLOWED=NO -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 test
      - name: Export test screenshots
        if: always() && matrix.suite != 'app'
        env:
          DEVICE_FAMILY: ${{ matrix.device }}
        run: |
          if [ -d "build/${DEVICE_FAMILY}Tests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "build/${DEVICE_FAMILY}Tests.xcresult" --output-path "build/screenshots/${DEVICE_FAMILY}"
          fi
      - name: Preserve simulator build and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arrify-prototype-${{ github.sha }}-${{ matrix.device }}-${{ matrix.suite }}
          path: |
            build/screenshots
            build/*Tests.xcresult
            build/simulator/Build/Products/Debug-iphonesimulator/Arrify.app
          retention-days: 7
  apple-build:
    needs: qualify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected device to pass
        env:
          QUALIFICATION_RESULT: ${{ needs.qualify.result }}
        run: test "$QUALIFICATION_RESULT" = success
