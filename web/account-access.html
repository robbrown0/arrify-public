<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Arrify · Account access</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/brand.css"></head><body><main class="auth"><div class="auth-brand"><img src="/api/v1/branding/icon" alt=""><span class="brand-name">Arr<span>ify</span></span></div><section class="auth-card"><h1 id="access-title">Back to your music</h1><p id="access-help">We’ll email you a secure link to reset your password.</p><form id="access-request"><label>Email or username<input name="identifier" autocomplete="username" maxlength="254" required></label><button class="primary">Send reset link</button><button type="button" id="access-verify" class="text-button">Resend verification email</button></form><form id="access-finish" hidden><div id="access-passwords"><label>New password<input id="access-password" type="password" autocomplete="new-password" minlength="15" maxlength="128"></label><label>Confirm password<input id="access-confirm" type="password" autocomplete="new-password" maxlength="128"></label></div><button class="primary" id="access-save">Save password</button></form><p id="access-message" role="status" aria-live="polite"></p><a href="/" class="text-button">Back to sign in</a></section></main><script src="/account-ui.js" defer></script><script src="/account-access.js" defer></script></body></html>
