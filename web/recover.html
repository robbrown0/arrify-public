<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#101211"><title>Arrify · Reset password</title><link rel="icon" href="/assets/icon-192.png"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/brand.css"></head><body><main class="auth"><div class="auth-brand" aria-label="Arrify"><img src="/assets/icon-192.png" alt=""><span class="brand-name">Arr<span>ify</span></span></div><div class="auth-card"><h1>A fresh set of keys.</h1><p id="recovery-help">Start here on your LAN, then choose your password securely.</p><button id="recovery-start" class="primary" hidden>Continue securely</button><form id="recovery-form" hidden><label>Username<input id="recovery-username" name="username" autocomplete="username" readonly></label><label>New password<input id="recovery-password" name="new-password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><label>Confirm password<input id="recovery-confirm" name="confirm-password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><button id="recovery-save" class="primary">Save password</button></form><p id="recovery-message" role="status"></p><a id="recovery-signin" class="text-button" href="/" hidden>Back to sign in</a></div></main><script src="/recover.js" defer></script></body></html>
